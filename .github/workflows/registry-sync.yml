name: Official registry sync

on:
  schedule:
    - cron: "30 6,18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Download and verify even when CKAN metadata is unchanged"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: official-registry-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
      REGISTRY_USER_AGENT: DajSrce/1.0 (+https://dajsrce.vercel.app; official-registry-sync)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Sync all active official associations
        shell: bash
        run: |
          args=(--batch-size 500)
          if [ "${{ inputs.force || false }}" = "true" ]; then args+=(--force); fi
          npm run registry:sync -- "${args[@]}"
      # The sync script runs maintenance itself, including after a failed
      # import. This repeats it unconditionally so a sync that dies before it
      # gets that far still cannot leave a partial snapshot projection behind:
      # one that did cost 26,500 orphan rows and pushed the database past its
      # storage ceiling. Draining it is idempotent and cheap when there is
      # nothing to remove.
      - name: Reclaim storage from any partial snapshot
        if: always()
        run: npm run registry:maintain -- --batch-size 500

      - name: Verify active registry publication
        run: npm run registry:verify
